name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check script syntax
        run: python -m py_compile yt_tts.py

      - name: Verify installed versions
        run: |
          python -c "from importlib.metadata import version; print('edge-tts', version('edge-tts')); print('pywin32', version('pywin32'))"

      - name: Build .exe with PyInstaller
        run: >
          pyinstaller --noconsole --onefile
          --collect-all certifi
          --hidden-import win32com.client
          --hidden-import pythoncom
          --name yt_tts yt_tts.py

      - name: Upload yt_tts.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt_tts-windows-exe
          path: dist/yt_tts.exe
          retention-days: 7
