name: Build Accessible YouTube Live TTS EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Force latest edge-tts >= 7.3.1)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Build standalone EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "yt_tts" yt_tts.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Live-TTS-Windows
          path: dist/yt_tts.exe
          retention-days: 7
