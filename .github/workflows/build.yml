name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Verify edge-tts version
        run: python -c "import edge_tts; print('Installed edge-tts version:', edge_tts.__version__)"

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all certifi --name yt_tts yt_tts.py

      - name: Upload yt_tts.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt_tts-windows-exe
          path: dist/yt_tts.exe
          retention-days: 7
